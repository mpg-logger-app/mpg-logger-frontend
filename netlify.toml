# Netlify hosting. Step-by-step guide: HOSTING.md in the mpg-logger-backend repo.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# API calls go to the backend on Google Cloud Run. Netlify fetches them behind the scenes, so the
# browser only sees this site's address: the app and the API share one origin and the session
# cookie works, exactly like Vite's proxy in development.
# After deploying the backend, put its Cloud Run host here (no https://, no trailing slash).
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE-WITH-YOUR-CLOUD-RUN-URL/api/:splat"
  status = 200
  force = true

# Pages like /home and /account are handled by the React app, so every path that isn't a real
# file gets index.html (files such as /assets/*, /sw.js and the icons are served as they are).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always check for a new version of the page and the service worker, so a deploy shows up
# straight away; Vite's /assets/* names change with their content, so those can be cached forever.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
